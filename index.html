<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sami van der Slik</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1a2b4a;
      --blue: #2563eb;
      --blue-light: #dbeafe;
      --grey: #64748b;
      --border: #e2e8f0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 40px;
      margin-bottom: 56px;
      opacity: 0;
      transform: translateY(16px);
      animation: up 0.6s ease 0.1s forwards;
    }

    .photo-wrap {
      flex-shrink: 0;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid white;
      box-shadow: 0 4px 24px rgba(37,99,235,0.13);
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .identity-text { display: flex; flex-direction: column; gap: 6px; }

    .identity-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -1px;
      line-height: 1;
    }

    .identity-role {
      font-size: 12px;
      font-weight: 400;
      color: var(--grey);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .identity-tagline {
      font-size: 14px;
      font-weight: 300;
      color: var(--grey);
      margin-top: 4px;
      max-width: 340px;
      line-height: 1.6;
    }

    .dot-divider {
      width: 6px; height: 6px;
      background: var(--blue);
      border-radius: 50%;
      margin: 0 auto 56px;
      opacity: 0;
      animation: up 0.6s ease 0.25s forwards;
    }

    .cards {
      display: flex;
      gap: 20px;
      opacity: 0;
      transform: translateY(16px);
      animation: up 0.6s ease 0.4s forwards;
    }

    .card {
      width: 220px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
      text-decoration: none;
      color: var(--navy);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(37,99,235,0.12);
      border-color: var(--blue);
    }

    .card-icon {
      width: 48px; height: 48px;
      background: var(--blue-light);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
    }

    .card-icon svg {
      width: 22px; height: 22px;
      stroke: var(--blue);
      fill: none;
      stroke-width: 2;
    }

    .card-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--grey);
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.2;
    }

    .card-arrow {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--blue);
    }

    .footer {
      margin-top: 64px;
      font-size: 12px;
      color: #cbd5e1;
      letter-spacing: 1px;
      opacity: 0;
      animation: up 0.6s ease 0.6s forwards;
    }

    @keyframes up {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .identity { flex-direction: column; text-align: center; gap: 20px; }
      .identity-tagline { max-width: 100%; }
      .cards { flex-direction: column; }
      .card { width: 100%; max-width: 320px; }
    }
  </style>
</head>
<body>

  <div class="identity">
    <div class="photo-wrap">
      <img src="foto.jpeg" alt="Sami van der Slik"/>
    </div>
    <div class="identity-text">
      <div class="identity-name">Sami van der Slik</div>
      <div class="identity-role">Business IT &amp; Management</div>
      <div class="identity-tagline">Analytisch, communicatief en resultaatgericht — ik verbind technologie en organisatie.</div>
    </div>
  </div>

  <div class="dot-divider"></div>

  <div class="cards">
    <a class="card" href="CV-SamivanderSlik.pdf" download>
      <div class="card-icon">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </div>
      <div class="card-label">Document</div>
      <div class="card-title">Download mijn CV</div>
      <div class="card-arrow">↓ PDF</div>
    </a>

    <a class="card" href="projecten.html">
      <div class="card-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      </div>
      <div class="card-label">Werk</div>
      <div class="card-title">Mijn projecten</div>
      <div class="card-arrow">→ Bekijken</div>
    </a>
  </div>

  <div class="footer">HVA · Amsterdam · 2026</div>

</body>
</html>
