<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bladconfetti — Sami van der Slik</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
 <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #2563eb;
      --blue-light: #dbeafe;
      --blue-dark: #1e3a8a;

      --navy: #1a2b4a;
      --grey: #64748b;
      --border: #e2e8f0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f8fafc;
    }

    nav {
      height: 56px;
      border-bottom: 1px solid var(--border);
      background: rgba(248,250,252,0.9);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      padding: 0 40px;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back {
      font-size: 13px;
      font-weight: 500;
      color: var(--blue);
      text-decoration: none;
    }

    .nav-sep {
      color: #cbd5e1;
      font-size: 13px;
    }

    .nav-page {
      font-size: 13px;
      color: var(--grey);
    }

    .hero {
      background: linear-gradient(
        135deg,
        var(--blue-dark) 0%,
        #1d4ed8 55%,
        var(--blue) 100%
      );

      padding: 72px 40px 64px;
      position: relative;
      overflow: hidden;
    }

    .hero-grid {
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);

      background-size: 32px 32px;
    }

    .hero-inner {
      position: relative;
      max-width: 820px;
      margin: 0 auto;
    }

    .hero-eyebrow {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #dbeafe;
      margin-bottom: 18px;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 700;
      color: white;
      margin-bottom: 8px;
    }

    .hero-subtitle {
      font-size: 14px;
      font-weight: 400;
      color: rgba(255,255,255,0.5);
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .hero-sub {
      font-size: 15px;
      font-weight: 300;
      color: rgba(255,255,255,0.75);
      max-width: 520px;
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meta-label {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.35);
    }

    .meta-value {
      font-size: 14px;
      font-weight: 500;
      color: white;
    }

    .content {
      max-width: 820px;
      margin: 0 auto;
      padding: 56px 40px 80px;
      display: flex;
      flex-direction: column;
      gap: 48px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      opacity: 0;
      animation: up 0.5s ease 0.15s forwards;
    }

    .tag {
      font-size: 12px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 20px;
    }

    .tag.tech,
    .tag.green {
      background: var(--blue-light);
      color: var(--blue);
    }

    .section {
      opacity: 0;
      animation: up 0.5s ease 0.25s forwards;
    }

    .section:nth-child(3) {
      animation-delay: 0.35s;
    }

    .section:nth-child(4) {
      animation-delay: 0.45s;
    }

    .section:nth-child(5) {
      animation-delay: 0.55s;
    }

    .section:nth-child(6) {
      animation-delay: 0.65s;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .section-text {
      font-size: 15px;
      font-weight: 300;
      line-height: 1.8;
      color: #475569;
    }

    .role-box {
      border-left: 3px solid var(--blue);
      padding: 16px 20px;
      background: white;
      border-radius: 0 10px 10px 0;
    }

    .role-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .role-text {
      font-size: 14px;
      font-weight: 300;
      color: #475569;
      line-height: 1.7;
    }

    ul.bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    ul.bullets li {
      font-size: 14px;
      font-weight: 300;
      color: #475569;
      line-height: 1.65;
      padding-left: 18px;
      position: relative;
    }

    ul.bullets li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 9px;
      width: 6px;
      height: 6px;
      border: 1.5px solid var(--blue);
      border-radius: 50%;
    }

    .skill-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
    }

    .skill-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .skill-icon {
      width: 34px;
      height: 34px;
      background: var(--blue-light);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .skill-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--navy);
    }

    .skill-desc {
      font-size: 12px;
      color: var(--grey);
      line-height: 1.5;
    }

    .back-row {
      border-top: 1px solid var(--border);
      padding-top: 32px;
      display: flex;
      justify-content: flex-end;
      opacity: 0;
      animation: up 0.5s ease 0.75s forwards;
    }

    .back-btn {
      font-size: 13px;
      font-weight: 500;
      color: var(--blue);
      text-decoration: none;
      padding: 10px 20px;
      border: 1.5px solid var(--blue);
      border-radius: 8px;
      transition: background 0.2s, color 0.2s;
    }

    .back-btn:hover {
      background: var(--blue);
      color: white;
    }

    @keyframes up {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .hero {
        padding: 48px 20px;
      }

      .content {
        padding: 40px 20px 60px;
      }

      nav {
        padding: 0 20px;
      }
    }
  </style>
</head>

</body>
</html>
